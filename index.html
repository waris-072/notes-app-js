<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <header id="header">
            <section class="logoSection">
                <h1>📝 Notes App</h1>
            </section>

            <section class="headerInfo">
                <p id="notesCount">0 Notes</p>
                <span id="saveStatus">All changes saved</span>
            </section>
        </header>

        <section id="controls">
            <article class="controlBox">
                <label for="searchInput"> Search Notes</label>
                <input type="text" id="searchInput" placeholder="Search by title or content...">

            </article>

            <article class="controlBox">
                <label for="categoryFilter"> Category</label>
                <select id="categoryFilter">
                    <option value="all">    All Categories</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                    <option value="personal">Personal</option>
                    <option value="ideas">Ideas</option>
                </select>
            </article>

            <article class="controlBox">
                <label for="sortFilter">    Sort Notes</label>
                <select id="sortFilter">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="az">A-Z</option>
                </select>
            </article>
            
            <article class="controlBox">
                <button id="clearFiltersBtn">Clear Filters</button>
            </article>
        </section>

        <section id="contentLayout">
            <!-- ================= NOTE FORM ================= -->

            <aside id="noteFormSection">
                <header class="sectionHeader">
                    <h2>Add New Note</h2>
                </header>
                <form id="noteForm">
                    <article class="formGroup">
                        <label for="titleInput">Title</label>
                        <input type="text" id="titleInput" placeholder="Enter note title...">
                    </article>

                    <article class="formGroup">
                        <label for="contentInput">Content</label>
                        <textarea id="contentInput" placeholder="Write your note here..."></textarea>
                    </article>

                    <article class="formGroup">
                        <label for="categoryInput">Category</label>

                        <select id="categoryInput">
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="personal">Personal</option>
                            <option value="ideas">Ideas</option>
                        </select>
                    </article>

                    <section id="formButtons">
                        <button type="submit" id="saveBtn">Add Note</button>
                    </section>
                    <p id="loadingText">Saving note...</p>
                </form>
            </aside>

            <!-- ================= NOTES DISPLAY ================= -->

            <section id="notesSection">

                <header class="sectionHeader">
                    <h2>Your Notes</h2>
                </header>

                <section id="notesContainer">

                    <!-- Dynamic Notes Render Here -->

                </section>

                <!-- Empty State -->
                <section id="emptyState">
                    <h3>No Notes Found</h3>
                    <p>Try adding a new note or changing filters.</p>
                </section>

            </section>
        </section>
    </main>

    <script type="module" src="JS/app.js"></script>
</body>
</html>
